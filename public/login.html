<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Task Buddy Database</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
       <div class="logo">
            <a href="/">
                <img src="images/task_buddyIcon.jpg" alt="Task Buddy Icon">
            </a>
            <a href="/">Task Buddy</a>
        </div>
        <strong>Admin Dashboard - Login</strong>
        <a href="/">Home</a>
    </nav>
    <div class="login-wrapper">
        <div class="login-block">
            <h1>Login</h1>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Log In</button>
            <p id="error"></p>
        </div>
    </div>
<footer>
    <p>Task Buddy Fake &copy; 2026</p>
</footer>
<script>
    localStorage.removeItem('token');
    localStorage.removeItem('username');
 
    document.getElementById('loginBtn').addEventListener('click', doLogin);
 
    document.getElementById('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
    });
    document.getElementById('username').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('password').focus();
    });
 
    function doLogin() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
 
        if (!username || !password) {
            document.getElementById('error').textContent = 'Enter both fields.';
            return;
        }
 
        document.getElementById('error').textContent = 'Logging in...';
 
        fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                document.getElementById('error').textContent = data.error;
                return;
            }
            window.location.href = '/admin';
        })
        .catch((err) => {
            document.getElementById('error').textContent = 'Login failed: ' + err.message;
        });
    }
</script>
 
</body>
</html>
