<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Task Buddy Database</title>
</head>
<body>
    <style>
        :root{
            --main-padding: 10px;
            --main-radius: 25px;
            --myWhite: #fefcfdf0;
            --paleSky: #bfcde0;
            --dustyGrape: #5d5d81;
            --spaceIndigo: #3b3355;
            --myBlack: #000505;

        }
        body{
            margin: 0;
            font-family: 'Franklin Gothic', 'Arial Narrow', Arial, sans-serif;
        }
                /* ── NAV ── */
        nav {
            background-color: whitesmoke;
            padding: var(--main-padding) 40px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid black;
            z-index: 100;
        }
 
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            width: 30px;         
            height: 30px;
            object-fit: contain;
            border-radius: 4px;
        }
 
        nav a {
            color: black;
            font-weight: bold;
            text-decoration: none;
        }
 
        /* -- LOGIN SECTION -- */
        .login-wrapper {
            min-height: 100vh;
            background-color: var(--paleSky);
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 60px; /* offset for fixed nav */
        }
 
        .login-block {
            background-color: var(--myWhite);
            border-radius: var(--main-radius);
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
 
        .login-block h1 {
            color: var(--spaceIndigo);
            font-size: 1.6rem;
            margin-bottom: 6px;
            text-align: center;
        }
 
        .login-block input {
            padding: var(--main-padding);
            border-radius: var(--main-radius);
            border: 1px solid var(--dustyGrape);
            width: 100%;
            font-family: 'Franklin Gothic', 'Arial Narrow', Arial, sans-serif;
            font-size: 0.95rem;
        }
 
        .login-block button {
            color: white;
            background-color: var(--spaceIndigo);
            border: none;
            border-radius: var(--main-radius);
            padding: 12px 28px;
            cursor: pointer;
            font-family: 'Franklin Gothic', 'Arial Narrow', Arial, sans-serif;
            font-size: 1rem;
            width: 100%;
        }
 
        .login-block button:hover {
            opacity: 0.85;
        }
 
        #error {
            text-align: center;
            color: var(--dustyGrape);
            font-size: 0.85rem;
            min-height: 18px;
        }
 
        /* ── FOOTER ── */
        footer {
            background-color: var(--myBlack);
            color: var(--myWhite);
            text-align: center;
            padding: var(--main-padding);
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">
            <img src="/images/task_buddyIcon.jpg" alt="Task Buddy Icon">
            Task Buddy
        </a>
        <a href="/">Home</a>
    </nav>
    <div class="login-wrapper">
        <div class="login-block">
            <h1>Admin Login</h1>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Log In</button>
            <p id="error"></p>
        </div>
    </div>
<footer>
    <p>Task Buddy Fake &copy; 2026</p>
</footer>
<script>
    localStorage.removeItem('token');
    localStorage.removeItem('username');
 
    document.getElementById('loginBtn').addEventListener('click', doLogin);
 
    document.getElementById('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
    });
    document.getElementById('username').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('password').focus();
    });
 
    function doLogin() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
 
        if (!username || !password) {
            document.getElementById('error').textContent = 'Enter both fields.';
            return;
        }
 
        document.getElementById('error').textContent = 'Logging in...';
 
        fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                document.getElementById('error').textContent = data.error;
                return;
            }
            window.location.href = '/admin';
        })
        .catch((err) => {
            document.getElementById('error').textContent = 'Login failed: ' + err.message;
        });
    }
</script>
 
</body>
</html>
