<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Task Buddy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
    <div class="logo">
            <a href="/">
                <img src="images/task_buddyIcon.jpg" alt="Task Buddy Icon">
            </a>
            <a href="/">Task Buddy</a>
        </div>
    <strong>Task Buddy - Admin Panel</strong>
    <a href="/logout"><button>Logout</button></a>
</nav>
<div class="page-wrapper">
    
    <!-- FORMS -->
    <section id="forms-section">
        <h1>Manage Products</h1>
        <div id="forms-container">
            <!-- ADD -->
            <div class="form-block">
                <h2>Add Product</h2>
                <input type="text" id="addName" placeholder="Name">
                <select id="addType">
                    <option value="">-- Type --</option>
                    <option value="plan">plan</option>
                    <option value="feature">feature</option>
                </select>
                <input type="text" id="addPrice" placeholder="Price (e.g. $9.99 /Month)">
                <textarea id="addDescription" placeholder="Description"></textarea>
                <input type="text" id="addFeats" placeholder="Features (comma separated)">
                <button id="addBtn">Add Product</button>
                <p class="msg" id="addMessage"></p>
            </div>

            <!-- UPDATE -->
            <div class="form-block">
                <h2>Update Product</h2>
                <input type="text" id="updateId" placeholder="Product _id">
                <input type="text" id="updateName" placeholder="New name (optional)">
                <input type="text" id="updatePrice" placeholder="New price (optional)">
                <textarea id="updateDescription" placeholder="New description (optional)"></textarea>
                <button id="updateBtn">Update Product</button>
                <p class="msg" id="updateMessage"></p>
            </div>

            <!-- DELETE -->
            <div class="form-block">
                <h2>Delete Product</h2>
                <input type="text" id="deleteId" placeholder="Product _id">
                <button id="deleteBtn">Delete Product</button>
                <p class="msg" id="deleteMessage"></p>
            </div>

        </div>
    </section>

    <!-- PRODUCTS -->
    <section id="products-section">
        <h1>All Products</h1>
        <button id="fetchBtn">Refresh Products</button>
        <div id="products-grid">
            <div class="empty-state">Click "Refresh Products" to load.</div>
        </div>
    </section>

    <footer>
        <p>Task Buddy Admin Panel</p>
    </footer>

</div>

<script>
    function setMsg(id, text) {
        document.getElementById(id).textContent = text;
    }

    function handle401(res) {
        if (res.status === 401) { window.location.href = '/login'; return true; }
        return false;
    }

    // Logout button uses pathing
    document.querySelector('.logout-btn').addEventListener('click', async () => {
        await fetch('/api/users/logout', { method: 'POST', credentials: 'include' });
        window.location.href = '/login';
    });
    // ------ Fetch & Render ------
    function fetchProducts() {
        fetch('/api/products', {credentials: 'include'})
            .then(res => { if (handle401(res)) return null; return res.json(); })
            .then(products => {
                if (!products) return;
                const grid = document.getElementById('products-grid');

                if (products.length === 0) {
                    grid.innerHTML = '<div class="empty-state">No products found.</div>';
                    return;
                }

                grid.innerHTML = products.map(p => `
                    <div class="product-block">
                        <div class="block-type">${p.type || ''}</div>
                        <h3>${p.name || '—'}</h3>
                        ${p.price ? `<div class="block-price">${p.price}</div>` : ''}
                        ${p.description ? `<div class="block-desc">${p.description}</div>` : ''}
                        ${p.feats && p.feats.length ? `
                            <ul>${p.feats.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}
                        <div class="block-id">
                            <strong>_id:</strong> ${p._id}
                            ${p.id !== undefined ? `<br><strong>id:</strong> ${p.id}` : ''}
                        </div>
                        ${p.addedBy ? `<div class="block-added">Added by: ${p.addedBy}</div>` : ''}
                    </div>
                `).join('');
            })
            .catch(() => {
                document.getElementById('products-grid').innerHTML =
                    '<div class="empty-state">Error fetching products.</div>';
            });
    }

    fetchProducts();
    document.getElementById('fetchBtn').addEventListener('click', fetchProducts);

    // ------ ADD -------
    document.getElementById('addBtn').addEventListener('click', () => {
        const name        = document.getElementById('addName').value.trim();
        const type        = document.getElementById('addType').value;
        const price       = document.getElementById('addPrice').value.trim();
        const description = document.getElementById('addDescription').value.trim();
        const featsRaw    = document.getElementById('addFeats').value.trim();

        if (!name) { setMsg('addMessage', 'Name is required.'); return; }

        const product = { name, type, description };
        if (price) product.price = price;
        if (featsRaw) product.feats = featsRaw.split(',').map(f => f.trim()).filter(Boolean);

        fetch('/api/products', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(product)
        })
        .then(res => { if (handle401(res)) return null; return res.json(); })
        .then(data => {
            if (!data) return;
            setMsg('addMessage', 'Product added!');
            document.getElementById('addName').value = '';
            document.getElementById('addType').value = '';
            document.getElementById('addPrice').value = '';
            document.getElementById('addDescription').value = '';
            document.getElementById('addFeats').value = '';
            fetchProducts();
        })
        .catch(() => setMsg('addMessage', 'Error adding product.'));
    });

    // ------ UPDATE ------
    document.getElementById('updateBtn').addEventListener('click', () => {
        const id = document.getElementById('updateId').value.trim();
        if (!id) { setMsg('updateMessage', 'Product _id is required.'); return; }

        const updates = {};
        const name        = document.getElementById('updateName').value.trim();
        const price       = document.getElementById('updatePrice').value.trim();
        const description = document.getElementById('updateDescription').value.trim();

        if (name)        updates.name = name;
        if (price)       updates.price = price;
        if (description) updates.description = description;

        if (Object.keys(updates).length === 0) {
            setMsg('updateMessage', 'Provide at least one field to update.');
            return;
        }

        fetch(`/api/products/${id}`, {
            method: 'PUT',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updates)
        })
        .then(res => { if (handle401(res)) return null; return res.json(); })
        .then(data => {
            if (!data) return;
            setMsg('updateMessage', `Updated! (matched: ${data.matchedCount}, modified: ${data.modifiedCount})`);
            document.getElementById('updateId').value = '';
            document.getElementById('updateName').value = '';
            document.getElementById('updatePrice').value = '';
            document.getElementById('updateDescription').value = '';
            fetchProducts();
        })
        .catch(() => setMsg('updateMessage', 'Error updating product.'));
    });

    // ------ DELETE ------
    document.getElementById('deleteBtn').addEventListener('click', () => {
        const id = document.getElementById('deleteId').value.trim();
        if (!id) { setMsg('deleteMessage', 'Product _id is required.'); return; }

        fetch(`/api/products/${id}`, { method: 'DELETE', credentials: 'include' })
        .then(res => { if (handle401(res)) return null; return res.json(); })
        .then(data => {
            if (!data) return;
            setMsg('deleteMessage', `Deleted! (count: ${data.deletedCount})`);
            document.getElementById('deleteId').value = '';
            fetchProducts();
        })
        .catch(() => setMsg('deleteMessage', 'Error deleting product.'));
    });
</script>

</body>
</html>
